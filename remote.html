<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LATYS Remote</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --ink: #e9ecf8; --dim: #9aa3c0; --faint: #5f6885;
    --accent: #22d3ee; --indigo: #818cf8; --ok: #34d399; --warn: #fbbf24; --danger: #f87171;
    --card: rgba(255,255,255,.05); --edge: rgba(255,255,255,.09);
  }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(700px 380px at 15% -5%, rgba(99,102,241,.15), transparent 60%),
      radial-gradient(600px 360px at 90% 8%, rgba(34,211,238,.08), transparent 60%),
      #05060f;
    color: var(--ink); min-height: 100vh; min-height: 100dvh;
    padding: calc(env(safe-area-inset-top, 0px) + 22px) 18px calc(env(safe-area-inset-bottom, 0px) + 34px);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .brand { font-size: 11px; letter-spacing: .3em; font-weight: 700; color: var(--accent); }
  .topbar { display: flex; align-items: center; gap: 8px; }
  .online { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px rgba(52,211,153,.7); }
  .card { margin-top: 14px; background: var(--card); border: 1px solid var(--edge); border-radius: 20px; padding: 16px; }
  .card h2 { font-size: 16px; font-weight: 700; }
  .muted { color: var(--dim); font-size: 13px; line-height: 1.55; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  button {
    font: inherit; font-size: 14px; font-weight: 600; color: var(--ink);
    background: rgba(255,255,255,.04); border: 1px solid var(--edge); border-radius: 12px;
    padding: 10px 18px; cursor: pointer;
  }
  button:active { transform: scale(.97); }
  button.accent { background: var(--accent); border-color: var(--accent); color: #04252b; font-weight: 800; }
  button.warn-text { color: var(--warn); } button.danger-text { color: var(--danger); }
  button:disabled { opacity: .4; }
  .pill { display: inline-block; border: 1px solid; border-radius: 999px; padding: 3px 11px; font-size: 11px; font-weight: 700; text-transform: capitalize; }
  .meta { font-size: 12px; color: var(--dim); }
  .track { margin-top: 12px; height: 6px; border-radius: 999px; background: rgba(255,255,255,.07); overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width .6s ease; }
  .step { display: flex; gap: 8px; align-items: flex-start; margin-top: 7px; font-size: 13px; }
  .step .sdot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex: none; }
  .step b { font-weight: 600; }
  .step span { color: var(--dim); font-size: 12px; flex: 1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .gate { border-color: rgba(251,191,36,.4) !important; background: rgba(251,191,36,.08) !important; }
  .gate h2 { color: var(--warn); }
  /* Pair screen */
  .pair { text-align: center; padding-top: 12vh; }
  .pair h1 { font-size: 26px; font-weight: 800; margin-top: 14px; }
  #code {
    margin-top: 22px; width: 230px; text-align: center; font-size: 32px; letter-spacing: 12px; font-weight: 700;
    color: var(--accent); background: var(--card); border: 1px solid var(--edge); border-radius: 16px;
    padding: 14px 0 14px 12px; outline: none;
  }
  #code:focus { border-color: rgba(34,211,238,.5); }
  .error { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 18px; }
  .unpair { display: block; margin: 28px auto 0; background: none; border: none; color: var(--faint); font-size: 12px; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Pair screen -->
  <div id="pairScreen" class="pair hide">
    <div class="brand">LATYS · REMOTE</div>
    <h1>Pair with your cockpit</h1>
    <p class="muted" style="margin-top:10px">In LATYS press <b>Ctrl/⌘ K</b>, run “Pair phone remote”,<br>and enter the 6-digit code here.</p>
    <input id="code" inputmode="numeric" pattern="\d*" maxlength="6" placeholder="••••••" autocomplete="one-time-code">
    <div id="pairError" class="error"></div>
    <button id="pairBtn" class="accent" disabled>Pair</button>
    <p class="muted" style="margin-top:26px;font-size:12px;color:var(--faint)">Tip: Share → Add to Home Screen for the full-screen app feel.</p>
  </div>

  <!-- Dashboard -->
  <div id="dash" class="hide">
    <div class="topbar">
      <div class="brand">LATYS · REMOTE</div>
      <div class="online"><span id="onlineDot" class="dot"></span><span id="onlineText">connecting…</span></div>
    </div>

    <div id="gateCard" class="card gate hide">
      <h2>Waiting for your approval</h2>
      <p id="gateMsg" class="muted" style="margin-top:6px"></p>
      <div class="row">
        <button class="accent" onclick="cmd('approve')">Approve</button>
        <button onclick="cmd('deny')">Deny</button>
      </div>
    </div>

    <div class="card">
      <div id="missionBody"></div>
    </div>

    <div id="nsCard" class="card hide">
      <h2>Night shift</h2>
      <p id="nsText" class="muted" style="margin-top:6px"></p>
      <div id="nsActions" class="row hide">
        <button class="accent" onclick="cmd('night-shift-start')">Start now</button>
      </div>
    </div>

    <div id="briefCard" class="card hide">
      <h2 style="color:var(--indigo)">Morning briefing</h2>
      <p id="briefText" class="muted" style="margin-top:6px"></p>
    </div>

    <button class="unpair" onclick="unpair()">Unpair this phone</button>
  </div>

</div>

<script>
const WORKER = 'https://latys-remote.latys.workers.dev'
const TOKEN_KEY = 'latys_remote_token'
const POLL_MS = 4000
const S_COLOR = {
  running:'#22d3ee','awaiting-confirm':'#fbbf24',blocked:'#fbbf24',failed:'#f87171',
  completed:'#34d399',cancelled:'#5f6885','rolled-back':'#5f6885',
  done:'#34d399',pending:'#5f6885',skipped:'#5f6885'
}
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
let pollTimer = null

function token() { try { return localStorage.getItem(TOKEN_KEY) } catch { return null } }

function show(screen) {
  $('pairScreen').classList.toggle('hide', screen !== 'pair')
  $('dash').classList.toggle('hide', screen !== 'dash')
}

// --- Pairing ---------------------------------------------------------------
const codeEl = $('code'), pairBtn = $('pairBtn')
codeEl.addEventListener('input', () => {
  codeEl.value = codeEl.value.replace(/\D/g, '').slice(0, 6)
  pairBtn.disabled = codeEl.value.length !== 6
})
pairBtn.addEventListener('click', async () => {
  pairBtn.disabled = true
  $('pairError').textContent = ''
  try {
    const r = await fetch(`${WORKER}/pair/claim`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: codeEl.value })
    })
    const body = await r.json()
    if (body.ok && body.token) {
      localStorage.setItem(TOKEN_KEY, body.token)
      start()
    } else {
      $('pairError').textContent = body.error === 'code not found or expired' ? 'Code not found or expired — generate a fresh one in LATYS.' : (body.error || 'Pairing failed.')
      pairBtn.disabled = false
    }
  } catch {
    $('pairError').textContent = 'Could not reach the relay. Check your connection.'
    pairBtn.disabled = false
  }
})

function unpair() {
  if (!confirm('Stop syncing with this cockpit?')) return
  localStorage.removeItem(TOKEN_KEY)
  if (pollTimer) clearInterval(pollTimer)
  show('pair')
}

// --- Dashboard ---------------------------------------------------------------
async function cmd(action) {
  const destructive = { cancel: 'Cancel the running mission? Agent terminals stay open.', rollback: 'Restore the project to the pre-mission snapshot? This cannot be undone.' }
  if (destructive[action] && !confirm(destructive[action])) return
  try {
    await fetch(`${WORKER}/command`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token()}` },
      body: JSON.stringify({ action, nonce: Date.now() + '-' + Math.random().toString(36).slice(2, 10) })
    })
    setTimeout(load, 1500)
  } catch { alert('Could not reach the relay.') }
}

function renderMission(snap) {
  const m = snap && snap.mission
  if (!m) {
    $('missionBody').innerHTML = `<h2>No mission running</h2><p class="muted" style="margin-top:6px">${esc(snap ? snap.spoken : 'Waiting for the cockpit…')}</p>`
    return
  }
  const c = S_COLOR[m.status] || '#9aa3c0'
  const halted = m.status === 'blocked' || m.status === 'failed'
  const live = m.status === 'running' || m.status === 'awaiting-confirm'
  const pct = Math.max(4, (m.stepsDone / Math.max(1, m.stepsTotal)) * 100)
  const steps = m.steps.map((st) => `
    <div class="step">
      <span class="sdot" style="background:${S_COLOR[st.status] || '#5f6885'}"></span>
      <b>${esc(st.agent)}</b><span>${esc(st.summary || st.status)}</span>
    </div>`).join('')
  const buttons = [
    halted ? '<button class="accent" onclick="cmd(\'retry\')">Retry</button><button onclick="cmd(\'skip\')">Skip</button>' : '',
    (live || halted) ? '<button class="warn-text" onclick="cmd(\'cancel\')">Cancel</button>' : '',
    !live ? '<button class="danger-text" onclick="cmd(\'rollback\')">Roll back</button>' : ''
  ].join('')
  $('missionBody').innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span class="pill" style="color:${c};border-color:${c}55;background:${c}1a">${esc(m.status)}</span>
      <span class="meta">wave ${m.wave}/${m.waves} · ${m.stepsDone}/${m.stepsTotal} steps${m.iteration > 1 ? ` · attempt ${m.iteration}/${m.maxIterations}` : ''}</span>
    </div>
    <h2 style="margin-top:8px">${esc(m.title)}</h2>
    <div class="track"><div class="fill" style="width:${pct}%"></div></div>
    <div style="margin-top:8px">${steps}</div>
    ${buttons ? `<div class="row">${buttons}</div>` : ''}`
}

async function load() {
  const t = token()
  if (!t) return
  let body = null
  try {
    const r = await fetch(`${WORKER}/state`, { headers: { Authorization: `Bearer ${t}` } })
    body = await r.json()
  } catch { /* offline */ }

  const online = !!(body && body.ok && body.online)
  $('onlineDot').classList.toggle('on', online)
  $('onlineText').textContent = online ? 'cockpit online' : 'cockpit offline'
  if (!body || !body.payload) return

  let snap
  try { snap = JSON.parse(body.payload) } catch { return }

  renderMission(snap)

  const gate = snap.awaitingApproval
  $('gateCard').classList.toggle('hide', !gate)
  if (gate) $('gateMsg').textContent = gate.message

  const ns = snap.nightShift
  $('nsCard').classList.toggle('hide', !ns)
  if (ns) {
    $('nsText').textContent =
      ns.shift === 'running' ? 'Running the queue now.'
      : ns.shift === 'armed' && ns.scheduledAt ? `Armed for ${new Date(ns.scheduledAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })} · ${ns.queued} queued`
      : ns.queued ? `${ns.queued} mission${ns.queued === 1 ? '' : 's'} queued — not armed`
      : 'Queue is empty.'
    $('nsActions').classList.toggle('hide', !(ns.shift !== 'running' && ns.queued > 0))
  }

  const brief = snap.briefing
  $('briefCard').classList.toggle('hide', !brief)
  if (brief) $('briefText').textContent = brief.spoken
}

function start() {
  show('dash')
  load()
  if (pollTimer) clearInterval(pollTimer)
  pollTimer = setInterval(load, POLL_MS)
}

token() ? start() : show('pair')
</script>
</body>
</html>
